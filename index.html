<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gargantua - ثقب أسود واقعي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Tajawal',sans-serif;overscroll-behavior:none}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#canvas:active{cursor:grabbing}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,420px);z-index:10;transition:all.45s cubic-bezier(.2,.8,.2,1)}
#hud.hidden{transform:translateX(-50%) translateY(140%);opacity:0;pointer-events:none}
.glass{background:rgba(16,18,26,.56);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
#hud-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
#title{display:flex;align-items:center;gap:10px}
#title b{font-size:15px;font-weight:900;letter-spacing:.2px;color:#fff}
#title span{font-size:11px;font-weight:400;color:rgba(255,255,255,.55);background:rgba(255,255,255,.08);padding:3px 8px;border-radius:100px}
#fps{font-size:11px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
#controls{padding:10px 20px 16px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:88px 1fr 42px;align-items:center;gap:12px}
.row label{font-size:12px;color:rgba(255,255,255,.7);font-weight:400}
.row output{font-size:11px;color:#fff;background:rgba(255,255,255,.1);padding:4px 7px;border-radius:8px;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.12);border-radius:10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;background:#fff;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.15);transition:.15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
#bottom-actions{display:flex;gap:8px;padding:0 20px 18px}
.btn{flex:1;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.primary{background:#fff;color:#000;border-color:#fff}
#toggleUI{position:fixed;left:16px;bottom:16px;width:48px;height:48px;border-radius:50%;z-index:11;transition:.3s}
#toggleUI.hiddenUI{bottom:calc(50% - 24px)}
#loader{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity.8s}
#loader h1{color:#fff;font-weight:900;font-size:28px;letter-spacing:-.5px;margin-bottom:8px}
#loader p{color:rgba(255,255,255,.5);font-size:13px}
</style>
</head>
<body>
<div id="loader"><h1>GARGANTUA</h1><p>جاري تهيئة الزمكان المنحني...</p></div>
<canvas id="canvas"></canvas>
<button id="toggleUI" class="glass btn" style="width:48px">⚙️</button>
<div id="hud" class="glass">
  <div id="hud-top">
    <div id="title"><b>غارغانتوا</b><span>Schwarzschild Raytracer</span></div>
    <div id="fps">60 FPS</div>
  </div>
  <div id="controls">
    <div class="row"><label>المسافة</label><input id="dist" type="range" min="4" max="22" step="0.05" value="11"><output id="distOut">11.0</output></div>
    <div class="row"><label>الميل</label><input id="tilt" type="range" min="5" max="85" step="0.5" value="22"><output id="tiltOut">22°</output></div>
    <div class="row"><label>سرعة القرص</label><input id="speed" type="range" min="0" max="2" step="0.01" value="0.85"><output id="speedOut">0.85</output></div>
  </div>
  <div id="bottom-actions">
    <button class="btn" id="resetBtn">إعادة ضبط ↺</button>
    <button class="btn primary" id="cinemaBtn">وضع سينمائي</button>
  </div>
</div>

<script type="x-shader/x-vertex" id="vs">
#version 300 es
precision highp float;
in vec2 position;
void main(){gl_Position=vec4(position,0.,1.);}
</script>

<script type="x-shader/x-fragment" id="fs">
#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 iResolution;
uniform float iTime;
uniform float uDist;
uniform float uTilt;
uniform float uSpeed;
uniform float uYaw;
uniform float uFov;

#define PI 3.14159265359
#define RS 1.0
#define DISK_IN 2.6
#define DISK_OUT 12.0

// hash / noise
float hash21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+28.23); return fract(p.x*p.y); }
float hash(float n){ return fract(sin(n)*43758.5453); }

float noise2(vec2 p){
  vec2 i=floor(p); vec2 f=fract(p);
  f=f*f*(3.-2.*f);
  float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.; float amp=.5;
  for(int i=0;i<5;i++){ v+=amp*noise2(p); p*=2.13; amp*=.5; }
  return v;
}
float fbm3(vec3 p){
  float v=0.; float amp=.5;
  for(int i=0;i<4;i++){
    v+=amp*noise2(p.xz + p.y);
    p*=2.02;
    amp*=.55;
  }
  return v;
}

// starfield + nebula
vec3 backgroundSky(vec3 rd){
  // equirect mapping
  vec2 uv = vec2(atan(rd.z, rd.x)/ (2.*PI) +.5, acos(clamp(rd.y,-1.,1.))/PI);
  uv.x*=3.; uv.y*=1.5;
  // stars
  vec2 gv = fract(uv*vec2(400.,200.))*2.-1.;
  vec2 id = floor(uv*vec2(400.,200.));
  float star = 0.;
  float rnd = hash21(id);
  if(rnd>.985){
    float d = length(gv);
    star = pow(max(0.,1.-d), 18.) * (0.5+0.5*rnd) * (0.7+0.6*sin(iTime*3.+rnd*20.));
  }
  // nebula dust lanes
  float neb = fbm(uv*1.5 + vec2(0.2,0.1));
  neb = pow(neb,3.)*2.2;
  vec3 nebCol = mix(vec3(0.05,0.08,0.22), vec3(0.8,0.25,0.45), fbm(uv*2.5)) * neb;
  nebCol += vec3(0.2,0.6,1.0)* pow(fbm(uv*3.+10.),4.)*0.6;
  // milky way band
  float band = exp(-12.*pow(abs(uv.y-0.5),2.)) * (0.5+0.5*fbm(uv*vec2(6.,1.)));
  vec3 bandCol = vec3(0.6,0.7,1.0)*band*0.35;

  vec3 col = vec3(0.01,0.012,0.02) + star + nebCol + bandCol;
  // subtle vignette
  return col;
}

// Keplerian velocity field (circular)
vec3 keplerVel(vec3 pos){
  float r = length(pos.xz);
  if(r<0.1) return vec3(0.);
  float v = 1.8 / sqrt(max(r,1.5)); // v ~ 1/sqrt(r)
  return vec3(-pos.z, 0., pos.x) * (v / max(r,0.001));
}

vec3 accretionDiskColor(vec3 pos, vec3 rayDir){
  float r = length(pos.xz);
  if(r<DISK_IN || r>DISK_OUT) return vec3(0.);

  // vertical thickness gaussian
  float thickness = 0.25 + 0.18 * r * 0.12;
  float yAtten = exp(- (pos.y*pos.y) / (2.*thickness*thickness));
  if(yAtten<0.01) return vec3(0.);

  // Keplerian shear for texture: rotate uv with 1/sqrt(r)
  float theta = atan(pos.z, pos.x);
  float omega = 2.2 / pow(max(r,1.), 1.5);
  float t = iTime * uSpeed * omega;
  float theta2 = theta + t;

  vec2 polar = vec2(log(r)*1.2, theta2*2.);
  // turbulent filaments
  float f1 = fbm(polar*1.2 + vec2(0., iTime*0.1));
  float f2 = fbm(polar*3.5 - vec2(t*0.5,0.));
  float f3 = fbm(polar*7.0);
  float turb = f1*0.6 + f2*0.3 + f3*0.15;

  // spiral arms + clumps
  float spiral = sin(theta2*3. + r*0.8 + turb*2.)*0.5+0.5;
  spiral = pow(spiral, 2.);

  // temperature profile T ~ r^-0.75
  float temp = pow(DISK_OUT / max(r, DISK_IN), 0.75);
  temp = clamp(temp, 0., 1.5);

  // Blackbody-ish gradient: cool red outer, hot white/blue inner
  vec3 colCool = vec3(0.8,0.15,0.05);
  vec3 colMid = vec3(1.0,0.55,0.15);
  vec3 colHot = vec3(1.0,0.95,0.7);
  vec3 colBlue = vec3(0.7,0.85,1.2);
  vec3 col = mix(colCool, colMid, clamp(temp*1.5,0.,1.));
  col = mix(col, colHot, pow(temp,1.2));
  col = mix(col, colBlue, pow(temp,3.)*0.6);

  // turbulent brightness modulation
  col *= (0.6 + 1.4*turb + spiral*0.9);
  col *= (1.0 + fbm3(pos*0.8 + vec3(iTime*0.3))*0.6);

  // Doppler beaming
  vec3 vel = keplerVel(pos);
  // viewer approx direction = -rayDir (incoming)
  float doppler = dot(normalize(vel), normalize(-rayDir));
  float beam = 1.0 + doppler*0.85; // beaming factor
  // frequency shift: approaching brighter & bluer
  float shift = clamp(doppler, -1.,1.);
  vec3 dopplerCol = mix(vec3(1.,0.4,0.1), vec3(0.9,1.0,1.4), clamp(shift*0.5+0.5,0.,1.));
  col *= mix(vec3(1.), dopplerCol, abs(shift)*0.25);
  col *= pow(max(beam,0.2), 2.2);

  // inner edge burn
  float innerGlow = exp(-pow((r-DISK_IN)*2.5,2.)) * 2.0;
  col += colHot * innerGlow;

  return col * yAtten;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = (frag - 0.5*iResolution.xy)/iResolution.y;

  // camera orbit
  float tiltRad = radians(uTilt);
  float yawRad = radians(uYaw);
  float dist = uDist;

  // camera position in world (Y up)
  vec3 ro = vec3(
    dist * sin(tiltRad) * sin(yawRad),
    dist * cos(tiltRad),
    dist * sin(tiltRad) * cos(yawRad)
  );

  // camera basis
  vec3 target = vec3(0.);
  vec3 forward = normalize(target - ro);
  vec3 up = vec3(0.,1.,0.);
  vec3 right = normalize(cross(forward, up));
  up = normalize(cross(right, forward));
  float fov = radians(uFov);
  vec3 rd = normalize(forward + uv.x * right * tan(fov*0.5)* (iResolution.x/iResolution.y) + uv.y * up * tan(fov*0.5));

  vec3 pos = ro;
  vec3 dir = rd;

  vec3 finalCol = vec3(0.);
  vec3 diskColAccum = vec3(0.);
  float alphaAccum = 0.;

  // photon ring accumulation
  float photonRing = 0.;
  float minR = 1000.;

  // raymarch curved spacetime
  const int STEPS = 90;
  float dt = 0.18; // adaptive base

  for(int i=0;i<STEPS;i++){
    float r = length(pos);
    minR = min(minR, r);

    if(r < RS){
      // swallowed
      break;
    }

    // gravitational bend: Schwarzschild approx
    // a = - 3/2 * RS * r_hat / r^2 scaled
    float invR = 1.0 / max(r, 0.6);
    float invR3 = invR*invR*invR;
    // stronger near horizon
    vec3 grav = -pos * (1.5 * RS * invR3) * (1.0 + 1.5*RS*invR);
    // integrate
    dir += grav * dt * (1.0 + 3.0*exp(-r*0.7));
    dir = normalize(dir);

    // check accretion disk intersection (Y=0 plane with thickness)
    // ray segment from prev pos to new pos
    vec3 nextPos = pos + dir * dt * max(0.6, r*0.35);
    // if crossing Y=0 near disk radii
    if(pos.y * nextPos.y < 0.0){
      float tCross = -pos.y / (nextPos.y - pos.y + 1e-6);
      vec3 crossPos = mix(pos, nextPos, tCross);
      float cr = length(crossPos.xz);
      if(cr > DISK_IN-0.5 && cr < DISK_OUT+0.5){
        vec3 c = accretionDiskColor(crossPos, dir);
        // opacity based on density + viewing angle
        float op = clamp(length(c)*0.45, 0., 1.);
        // front-to-back blending
        diskColAccum = diskColAccum + (1.0-alphaAccum) * c * op;
        alphaAccum += (1.0-alphaAccum)*op*0.9;
      }
    }
    // also sample disk volume if inside thickness (for inclined view)
    float rDisk = length(pos.xz);
    if(abs(pos.y) < 0.8 && rDisk > DISK_IN && rDisk < DISK_OUT){
      vec3 cVol = accretionDiskColor(pos, dir)*0.18;
      diskColAccum += (1.0-alphaAccum)*cVol;
      alphaAccum += (1.0-alphaAccum)*0.05;
    }

    // photon sphere brilliance: r ~ 1.5 RS
    float photonDist = abs(r - 1.5*RS);
    photonRing += exp(-photonDist*photonDist*28.) * 0.12 * exp(-float(i)*0.02);

    // adaptive step: smaller near BH
    dt = mix(0.05, 0.5, clamp((r-1.0)/8.0, 0.,1.));
    pos = nextPos;

    if(length(pos) > 45.0) break;
    if(alphaAccum>0.98) break;
  }

  // background lensed sky
  vec3 sky = vec3(0.);
  float escaped = length(pos) > 20.0? 1.0 : 0.0;
  if(escaped>0.5){
    vec3 skyDir = normalize(dir);
    // slight aberration near BH
    sky = backgroundSky(skyDir);
    // dim near shadow edge by gravitational redshift
    float redshift = clamp(minR/4.0, 0.,1.);
    sky *= (0.3 + 0.7*redshift);
  }

  // combine: background behind disk, disk over it, shadow
  finalCol = mix(sky, diskColAccum, alphaAccum);

  // photon ring overlay (additive, extremely sharp)
  float photonSharp = photonRing * (2.0 + 3.0*exp(-minR*0.5));
  vec3 photonCol = vec3(1.0,0.92,0.7)*photonSharp*3.5;
  finalCol += photonCol;

  // event horizon pure black + soft edge glow from lensing
  float horizonFade = smoothstep(RS, RS+0.15, minR);
  finalCol *= horizonFade;
  // inner shadow darkness
  if(minR < RS*1.02) finalCol = vec3(0.);

  // tone mapping ACES-ish
  finalCol = finalCol / (finalCol + vec3(1.0));
  finalCol = pow(finalCol, vec3(0.9));
  // subtle bloom for bright disk
  finalCol += vec3(0.06,0.04,0.02)*pow(max(diskColAccum.r,0.),2.)*0.6;

  // vignette
  float vign = 1.0 - dot(uv,uv)*0.15;
  finalCol *= vign;

  fragColor = vec4(finalCol,1.0);
}
</script>

<script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', {antialias:false, powerPreference:'high-performance', desynchronized:true});
if(!gl){ alert('WebGL2 غير مدعوم'); }

function createShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}
const vs = createShader(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
const fs = createShader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
const prog = gl.createProgram();
gl.attachShader(prog, vs); gl.attachShader(prog, fs);
gl.linkProgram(prog);
gl.useProgram(prog);

const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
const locPos = gl.getAttribLocation(prog, 'position');
gl.enableVertexAttribArray(locPos);
gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);

const uni = {
  res: gl.getUniformLocation(prog,'iResolution'),
  time: gl.getUniformLocation(prog,'iTime'),
  dist: gl.getUniformLocation(prog,'uDist'),
  tilt: gl.getUniformLocation(prog,'uTilt'),
  speed: gl.getUniformLocation(prog,'uSpeed'),
  yaw: gl.getUniformLocation(prog,'uYaw'),
  fov: gl.getUniformLocation(prog,'uFov'),
};

let state = { dist:11, tilt:22, yaw:-28, fov:36, speed:0.85, time:0 };
let drag = { active:false, x:0, y:0, yaw0:0, tilt0:0 };
let fpsLast=performance.now(), frames=0, fps=60;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 1.5);
  const w = Math.round(innerWidth * dpr);
  const h = Math.round(innerHeight * dpr);
  if(canvas.width!==w || canvas.height!==h){
    canvas.width=w; canvas.height=h;
    canvas.style.width=innerWidth+'px';
    canvas.style.height=innerHeight+'px';
    gl.viewport(0,0,w,h);
  }
}
window.addEventListener('resize', resize); resize();

// inputs
const $dist=document.getElementById('dist'), $tilt=document.getElementById('tilt'), $speed=document.getElementById('speed');
const $distOut=document.getElementById('distOut'), $tiltOut=document.getElementById('tiltOut'), $speedOut=document.getElementById('speedOut');
function bindSlider(el, key, fmt){
  const upd = ()=>{ state[key]=parseFloat(el.value); fmt(); };
  el.addEventListener('input', upd); upd();
}
bindSlider($dist,'dist',()=>{$distOut.textContent=state.dist.toFixed(1);});
bindSlider($tilt,'tilt',()=>{$tiltOut.textContent=Math.round(state.tilt)+'°';});
bindSlider($speed,'speed',()=>{$speedOut.textContent=state.speed.toFixed(2);});

// touch + mouse orbit
function onDown(x,y){
  drag.active=true; drag.x=x; drag.y=y; drag.yaw0=state.yaw; drag.tilt0=state.tilt;
}
function onMove(x,y){
  if(!drag.active) return;
  const dx=(x-drag.x); const dy=(y-drag.y);
  state.yaw = drag.yaw0 + dx*0.3;
  state.tilt = Math.min(85, Math.max(5, drag.tilt0 + dy*0.25));
  $tilt.value=state.tilt; $tiltOut.textContent=Math.round(state.tilt)+'°';
}
function onUp(){ drag.active=false; }

canvas.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', e=>{
  if(e.touches.length===1) onDown(e.touches[0].clientX,e.touches[0].clientY);
  if(e.touches.length===2){
    drag.pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    drag.dist0=state.dist;
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===1) onMove(e.touches[0].clientX,e.touches[0].clientY);
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    const scale=d/(drag.pinchDist||d);
    state.dist=Math.min(22,Math.max(4, drag.dist0/scale));
    $dist.value=state.dist; $distOut.textContent=state.dist.toFixed(1);
  }
},{passive:false});
canvas.addEventListener('touchend', onUp);
canvas.addEventListener('wheel', e=>{
  state.dist=Math.min(22,Math.max(4, state.dist + e.deltaY*0.01));
  $dist.value=state.dist; $distOut.textContent=state.dist.toFixed(1);
},{passive:true});

// UI toggle
const hud=document.getElementById('hud'), toggleUI=document.getElementById('toggleUI');
let uiVisible=true;
function setUI(v){
  uiVisible=v;
  hud.classList.toggle('hidden',!v);
  toggleUI.textContent=v?'✕':'⚙️';
  toggleUI.classList.toggle('hiddenUI',!v);
}
toggleUI.onclick=()=>setUI(!uiVisible);
document.getElementById('cinemaBtn').onclick=()=>setUI(false);
document.getElementById('resetBtn').onclick=()=>{
  state={dist:11, tilt:22, yaw:-28, fov:36, speed:0.85, time:state.time};
  $dist.value=state.dist; $tilt.value=state.tilt; $speed.value=state.speed;
  $distOut.textContent='11.0'; $tiltOut.textContent='22°'; $speedOut.textContent='0.85';
};

let start=performance.now();
function frame(now){
  resize();
  const t=(now-start)*0.001;
  state.time=t;
  gl.useProgram(prog);
  gl.uniform2f(uni.res, canvas.width, canvas.height);
  gl.uniform1f(uni.time, t);
  gl.uniform1f(uni.dist, state.dist);
  gl.uniform1f(uni.tilt, state.tilt);
  gl.uniform1f(uni.speed, state.speed);
  gl.uniform1f(uni.yaw, state.yaw);
  gl.uniform1f(uni.fov, state.fov);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  frames++;
  if(now-fpsLast>500){
    fps=Math.round(frames*1000/(now-fpsLast));
    document.getElementById('fps').textContent=fps+' FPS';
    fpsLast=now; frames=0;
  }
  if(now>1500) document.getElementById('loader').style.opacity='0';
  if(now>2300){ const l=document.getElementById('loader'); if(l) l.style.display='none'; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
