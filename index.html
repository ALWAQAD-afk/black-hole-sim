<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gargantua V2</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Tajawal',sans-serif}
#canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,420px);z-index:10;transition:.4s}
#hud.hidden{transform:translateX(-50%) translateY(150%);opacity:0}
.glass{background:rgba(20,22,32,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:22px}
#hud-top{display:flex;justify-content:space-between;padding:14px 18px 8px;color:#fff}
#controls{padding:10px 18px 14px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:10px;color:rgba(255,255,255,.8);font-size:12px}
.row output{background:rgba(255,255,255,.1);padding:3px 8px;border-radius:8px;text-align:center;color:#fff}
input[type=range]{width:100%;accent-color:#fff}
.btns{display:flex;gap:8px;padding:0 18px 16px}
.btn{flex:1;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-weight:700}
.btn.primary{background:#fff;color:#000}
#toggleUI{position:fixed;left:14px;bottom:14px;width:48px;height:48px;border-radius:50%;z-index:11}
#error{position:fixed;top:10px;left:10px;right:10px;background:#ff1a1a;color:#fff;padding:12px;border-radius:12px;z-index:100;display:none;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="error"></div>
<canvas id="canvas"></canvas>
<button id="toggleUI" class="glass btn">⚙️</button>
<div id="hud" class="glass">
  <div id="hud-top"><b>غارغانتوا V2 - تم الإصلاح</b><span id="fps">-- FPS</span></div>
  <div id="controls">
    <div class="row"><label>المسافة</label><input id="dist" type="range" min="3" max="22" step="0.1" value="10"><output id="dO">10</output></div>
    <div class="row"><label>الميل</label><input id="tilt" type="range" min="8" max="85" value="26"><output id="tO">26°</output></div>
    <div class="row"><label>السرعة</label><input id="speed" type="range" min="0" max="2" step="0.05" value="0.9"><output id="sO">0.9</output></div>
  </div>
  <div class="btns"><button class="btn" id="reset">إعادة ضبط</button><button class="btn primary" id="cinema">وضع سينمائي</button></div>
</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 position; void main(){gl_Position=vec4(position,0.,1.);}</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 iResolution; uniform float iTime; uniform float uDist; uniform float uTilt; uniform float uYaw; uniform float uSpeed;

#define RS 1.0
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.-2.*f);float a=hash(i);float b=hash(i+vec2(1,0));float c=hash(i+vec2(0,1));float d=hash(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float fbm(vec2 p){float v=0.;float amp=.5;for(int i=0;i<4;i++){v+=amp*noise(p);p*=2.1;amp*=.5;}return v;}

vec3 skybox(vec3 rd){
  vec2 uv=vec2(atan(rd.z,rd.x)*0.1591543+0.5, acos(clamp(rd.y,-1.,1.))*0.3183099);
  float stars = 0.;
  vec2 gid = floor(uv*vec2(300.,150.));
  if(hash(gid)>0.992){ vec2 f=fract(uv*vec2(300.,150.))-0.5; stars = pow(1.-length(f)*2., 16.)*1.5; }
  float neb = pow(fbm(uv*2.5),3.)*1.5;
  vec3 nebCol = mix(vec3(0.02,0.05,0.2), vec3(0.8,0.3,0.5), fbm(uv*3.)) * neb;
  float band = exp(-8.*pow(abs(uv.y-0.48),2.)) * fbm(uv*vec2(5.,1.))*0.6;
  return vec3(0.015,0.018,0.03) + stars + nebCol + vec3(0.5,0.6,1.)*band;
}
vec3 diskColor(vec3 p, vec3 rd){
  float r=length(p.xz); if(r<2.2 || r>11.) return vec3(0.);
  float yAtt = exp(-p.y*p.y/(0.12+0.05*r));
  if(yAtt<0.01) return vec3(0.);
  float theta=atan(p.z,p.x);
  float om = 1.6/sqrt(max(r,1.));
  float th = theta + iTime*uSpeed*om;
  vec2 uvp = vec2(log(r)*1.1, th*1.8);
  float turb = fbm(uvp*1.3) + 0.5*fbm(uvp*3.);
  float spiral = pow(0.5+0.5*sin(th*2.5 + r*0.7), 2.);
  float T = clamp(pow(8./max(r,2.2),0.8),0.,1.5);
  vec3 col = mix(vec3(0.9,0.2,0.05), vec3(1.,0.6,0.2), T);
  col = mix(col, vec3(1.,0.95,0.8), pow(T,1.8));
  col *= 0.6 + 1.2*turb + 0.6*spiral;
  // Doppler
  vec3 vel = vec3(-p.z,0.,p.x)*(1.2/sqrt(max(r,1.))/max(r,0.5));
  float dop = dot(normalize(vel), -rd);
  col *= pow(max(0.3,1.+dop*0.8),2.);
  if(dop>0.) col += vec3(0.4,0.6,1.)*dop*0.4; else col += vec3(0.6,0.2,0.1)*abs(dop)*0.2;
  float inner = exp(-pow((r-2.2)*1.8,2.))*1.2;
  col += inner*vec3(1.,0.9,0.6);
  return col*yAtt;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*iResolution)/iResolution.y;
  float tilt=radians(uTilt), yaw=radians(uYaw);
  vec3 ro = vec3(uDist*sin(tilt)*sin(yaw), uDist*cos(tilt), uDist*sin(tilt)*cos(yaw));
  vec3 target=vec3(0.); vec3 fw=normalize(target-ro); vec3 up=vec3(0,1,0);
  vec3 rt=normalize(cross(fw,up)); up=cross(rt,fw);
  vec3 rd = normalize(fw + uv.x*rt*0.9 + uv.y*up*0.9);

  vec3 pos=ro; vec3 dir=rd;
  vec3 accCol=vec3(0.); float accA=0.; float minR=100.; float photon=0.;

  for(int i=0;i<64;i++){
    float r=length(pos); minR=min(minR,r);
    if(r<RS*0.95) break;
    // bend - أخف بكثير عشان ما ينبلع بسرعة
    float invR = 1./max(r,0.8);
    vec3 grav = -pos * (1.0*RS*invR*invR*invR);
    dir = normalize(dir + grav*0.25);
    vec3 nextPos = pos + dir * mix(0.12,0.6, clamp((r-1.)/6.,0.,1.));

    // تقاطع القرص
    if(pos.y*nextPos.y<0.){
      float t = -pos.y/(nextPos.y-pos.y+1e-5);
      vec3 cp = mix(pos,nextPos,t);
      vec3 c = diskColor(cp, dir);
      float op = clamp(dot(c,vec3(0.33)),0.,1.);
      accCol += (1.-accA)*c*op;
      accA += (1.-accA)*op*0.85;
    }
    if(abs(pos.y)<0.6){ accCol += (1.-accA)*diskColor(pos,dir)*0.15; }

    photon += exp(-pow(r-1.5,2.)*20.)*0.06;
    pos = nextPos;
    if(length(pos)>35.) break;
  }

  vec3 sky = skybox(normalize(dir));
  vec3 finalCol = mix(sky, accCol, accA);
  finalCol += photon*vec3(1.,0.9,0.6)*4.;
  finalCol *= smoothstep(RS*0.9, RS*1.2, minR);
  if(minR<1.02) finalCol*=0.08;

  finalCol = finalCol/(finalCol+vec3(1.)); finalCol=pow(finalCol,vec3(0.9));
  finalCol *= 1.-dot(uv,uv)*0.18;

  fragColor=vec4(finalCol,1.);
}
</script>

<script>
const errBox=document.getElementById('error');
const canvas=document.getElementById('canvas');
const gl=canvas.getContext('webgl2',{antialias:false});
if(!gl){ errBox.style.display='block'; errBox.textContent='WebGL2 غير مدعوم في هذا المتصفح'; }
function comp(type, src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ errBox.style.display='block'; errBox.textContent=gl.getShaderInfoLog(s); console.error(gl.getShaderInfoLog(s)); }
  return s;
}
const vs=comp(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
const fs=comp(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
const prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ errBox.style.display='block'; errBox.textContent=gl.getProgramInfoLog(prog); }
gl.useProgram(prog);
const quad=new Float32Array([-1,-1,1,-1,-1,1,1,1]);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,quad,gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'position'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={res:gl.getUniformLocation(prog,'iResolution'),time:gl.getUniformLocation(prog,'iTime'),dist:gl.getUniformLocation(prog,'uDist'),tilt:gl.getUniformLocation(prog,'uTilt'),yaw:gl.getUniformLocation(prog,'uYaw'),speed:gl.getUniformLocation(prog,'uSpeed')};

let S={dist:10,tilt:26,yaw:-30,speed:0.9,time:0};
let drag={a:false,x:0,y:0,y0:0,t0:0};
function resize(){const d=Math.min(devicePixelRatio||1,1.5);const w=innerWidth*d,h=innerHeight*d; if(canvas.width!=w||canvas.height!=h){canvas.width=w;canvas.height=h;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';gl.viewport(0,0,w,h);}}
window.addEventListener('resize',resize);resize();
const $dist=document.getElementById('dist'),$tilt=document.getElementById('tilt'),$speed=document.getElementById('speed');
$dist.oninput=()=>{S.dist=parseFloat($dist.value);document.getElementById('dO').textContent=S.dist.toFixed(1)};
$tilt.oninput=()=>{S.tilt=parseFloat($tilt.value);document.getElementById('tO').textContent=Math.round(S.tilt)+'°'};
$speed.oninput=()=>{S.speed=parseFloat($speed.value);document.getElementById('sO').textContent=S.speed};
function down(x,y){drag.a=true;drag.x=x;drag.y=y;drag.y0=S.yaw;drag.t0=S.tilt}
function move(x,y){if(!drag.a)return;S.yaw=drag.y0+(x-drag.x)*0.35;S.tilt=Math.min(85,Math.max(8,drag.t0+(y-drag.y)*0.3));$tilt.value=S.tilt;document.getElementById('tO').textContent=Math.round(S.tilt)+'°'}
function up(){drag.a=false}
canvas.addEventListener('mousedown',e=>down(e.clientX,e.clientY)); window.addEventListener('mousemove',e=>move(e.clientX,e.clientY)); window.addEventListener('mouseup',up);
canvas.addEventListener('touchstart',e=>{if(e.touches.length==1)down(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault(); if(e.touches.length==1)move(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
canvas.addEventListener('touchend',up);
canvas.addEventListener('wheel',e=>{S.dist=Math.min(22,Math.max(3,S.dist+e.deltaY*0.008));$dist.value=S.dist;document.getElementById('dO').textContent=S.dist.toFixed(1)},{passive:true});

const hud=document.getElementById('hud'),tog=document.getElementById('toggleUI'); let vis=true;
tog.onclick=()=>{vis=!vis;hud.classList.toggle('hidden',!vis);tog.textContent=vis?'✕':'⚙️'};
document.getElementById('cinema').onclick=()=>{vis=false;hud.classList.add('hidden');tog.textContent='⚙️'};
document.getElementById('reset').onclick=()=>{S.dist=10;S.tilt=26;S.yaw=-30;$dist.value=10;$tilt.value=26;document.getElementById('dO').textContent='10.0';document.getElementById('tO').textContent='26°'};

let start=performance.now(),frames=0,last=performance.now();
function loop(now){
  resize();
  gl.useProgram(prog);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,(now-start)*0.001);
  gl.uniform1f(U.dist,S.dist); gl.uniform1f(U.tilt,S.tilt); gl.uniform1f(U.yaw,S.yaw); gl.uniform1f(U.speed,S.speed);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  frames++; if(now-last>500){document.getElementById('fps').textContent=Math.round(frames*1000/(now-last))+' FPS';last=now;frames=0;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
